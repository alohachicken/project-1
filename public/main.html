<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Marketplace</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
    }

    .sidebar {
      width: 200px;
      padding: 20px;
      border-right: 1px solid #ccc;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      cursor: pointer;
    }

    .content {
      flex: 1;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 10px;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>Menu</h3>
    <button onclick="goProfile()">Profile</button>
    <button onclick="goCreate()">Create Product</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <h1>Marketplace</h1>
    <div id="products" class="grid"></div>
  </div>

  <script src="app.js"></script>
  <script>
    // Protect page
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "/";
    }

    async function loadProducts() {
      const res = await fetch("/api/products", {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const products = await res.json();
      const container = document.getElementById("products");
      container.innerHTML = "";

      products.forEach(p => {
        container.innerHTML += `
          <div class="card">
            <img src="${p.imageUrl || 'https://via.placeholder.com/200'}" />
            <h4>${p.title}</h4>
            <p>RM ${p.price}</p>
          </div>
        `;
      });
    }

    function goProfile() {
      window.location.href = "/profile.html";
    }

    function goCreate() {
      window.location.href = "/create.html";
    }

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/";
    }

    loadProducts();
  </script>
</body>
</html>
